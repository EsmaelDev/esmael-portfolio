<!doctype html>
<html lang="en" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Esmael Gemechu — Software Engineering Student & Web Developer</title>
    <meta
      name="description"
      content="Portfolio of Esmael Gemechu, a Software Engineering student at Arba Minch University, Ethiopia — building useful digital experiences that solve real problems."
    />
    <meta name="author" content="Esmael Gemechu" />
    <meta name="theme-color" content="#090A0C" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

    <!-- Social sharing (open graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Esmael Gemechu — Software Engineering Student" />
    <meta
      property="og:description"
      content="Building useful digital experiences that solve real problems. Selected work, skills and process."
    />
    <!-- ✏️ NOTE: og:image needs an ABSOLUTE URL after you deploy (scrapers ignore relative paths).
         After deploying, replace "./og-cover.jpg" with e.g. "https://your-domain.com/og-cover.jpg" -->
    <meta property="og:image" content="./og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Space Grotesk (display) · Inter (body) · JetBrains Mono (mono) · Fraunces (serif accent).
         Loaded from Google Fonts with display=swap; the site falls back to system fonts offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Restore saved color theme before first paint (prevents flash) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("eg-theme");
          if (saved === "ivory" || saved === "obsidian") {
            document.documentElement.dataset.theme = saved;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
